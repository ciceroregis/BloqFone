name: Android Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
